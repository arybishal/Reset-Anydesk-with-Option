<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 440" width="850" height="440">
  <defs>
    <filter id="win-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="850" height="440" rx="12" fill="#0d1117" />

  <!-- Terminal Window -->
  <g transform="translate(45, 30)" filter="url(#win-shadow)">
    <!-- Window Header -->
    <rect width="760" height="380" rx="10" fill="#0c0c0c" stroke="#30363d" stroke-width="1.5" />
    <path d="M0 10 Q0 0 10 0 L750 0 Q760 0 760 10 L760 38 L0 38 Z" fill="#1f242c" />
    
    <!-- Window Controls -->
    <circle cx="25" cy="19" r="6" fill="#ff5f56" />
    <circle cx="45" cy="19" r="6" fill="#ffbd2e" />
    <circle cx="65" cy="19" r="6" fill="#27c93f" />

    <!-- Title -->
    <text x="380" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Consolas, monospace" font-size="13" fill="#8b949e" text-anchor="middle">
      Administrator: AnyDesk Reset Utility
    </text>

    <!-- Console Text Content -->
    <g transform="translate(28, 68)" font-family="Consolas, 'Cascadia Code', 'Courier New', monospace" font-size="14">
      <text y="0" fill="#00ff66" font-weight="bold">==========================================</text>
      <text y="24" fill="#00ff66" font-weight="bold">         AnyDesk Reset Utility</text>
      <text y="48" fill="#00ff66" font-weight="bold">==========================================</text>

      <text y="90" fill="#f0f6fc">1. Safe reset: back up and restart service</text>
      <text y="116" fill="#f0f6fc">2. Open AnyDesk configuration folders</text>
      <text y="142" fill="#f0f6fc">3. Hard reset: back up and clean temporary cache</text>
      <text y="168" fill="#f0f6fc">4. Exit</text>

      <!-- Selection Prompt -->
      <g transform="translate(0, 215)">
        <text y="0" fill="#58a6ff" font-weight="bold">Select an option: [1, 2, 3, 4] _</text>
        <!-- Blinking cursor badge -->
        <rect x="238" y="-14" width="10" height="18" fill="#58a6ff" opacity="0.85" />
      </g>

      <!-- Description hints at bottom of terminal -->
      <g transform="translate(0, 260)">
        <rect width="704" height="34" rx="6" fill="#161b22" stroke="#21262d" />
        <text x="16" y="22" fill="#8b949e" font-size="12">
          [Tip] Press 1 for quick freeze/service recovery | Press 3 for full cache wipe with auto-backup
        </text>
      </g>
    </g>
  </g>
</svg>
