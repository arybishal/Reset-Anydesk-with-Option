<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 900; font-size: 54px; fill: #000000; letter-spacing: 2px; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 16px; fill: #000000; letter-spacing: 3px; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; fill: #475569; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 14px; fill: #000000; }
      .card-desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #64748b; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 11px; fill: #000000; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="420" fill="#ffffff" stroke="#000000" stroke-width="4"/>

  <!-- Top Decorative Yellow Accent Bar -->
  <rect x="0" y="0" width="1200" height="12" fill="#facc15"/>

  <!-- Subtle Grid Pattern Lines -->
  <line x1="80" y1="40" x2="80" y2="380" stroke="#f1f5f9" stroke-width="2"/>
  <line x1="1120" y1="40" x2="1120" y2="380" stroke="#f1f5f9" stroke-width="2"/>

  <!-- Brand Logo Icon Box -->
  <rect x="80" y="60" width="64" height="64" rx="8" fill="#facc15" stroke="#000000" stroke-width="3"/>
  <path d="M122 82 v10 h-10 M121 102 a16 16 0 1 1 -1 -14 l10 -10" fill="none" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Main Headers -->
  <text x="160" y="96" class="title">ANY RESET</text>
  <rect x="160" y="112" width="140" height="22" rx="4" fill="#000000"/>
  <text x="170" y="127" class="badge-text" fill="#ffffff">WINDOWS SOFTWARE</text>

  <rect x="310" y="112" width="70" height="22" rx="4" fill="#fef08a" stroke="#000000" stroke-width="1.5"/>
  <text x="325" y="127" class="badge-text">v1.0.0</text>

  <text x="80" y="180" class="subtitle">COMPLETE ANYDESK MAINTENANCE &amp; FACTORY RESET UTILITY</text>
  <text x="80" y="210" class="desc">Engineered for Windows. Clean temporary caches, diagnostic traces, and restore AnyDesk to default with a brand-new ID.</text>

  <!-- Feature Pillar Cards -->
  <!-- Card 1 -->
  <g transform="translate(80, 250)">
    <rect width="240" height="110" rx="8" fill="#f8fafc" stroke="#000000" stroke-width="2"/>
    <rect x="0" y="0" width="240" height="8" rx="4" fill="#facc15"/>
    <text x="18" y="42" class="card-title">Cache &amp; Temp Cleaner</text>
    <text x="18" y="66" class="card-desc">Deep scan for local, roaming,</text>
    <text x="18" y="84" class="card-desc">and temp session render caches.</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(345, 250)">
    <rect width="240" height="110" rx="8" fill="#f8fafc" stroke="#000000" stroke-width="2"/>
    <rect x="0" y="0" width="240" height="8" rx="4" fill="#facc15"/>
    <text x="18" y="42" class="card-title">Factory Reset (New ID)</text>
    <text x="18" y="66" class="card-desc">Wipes identity tokens and</text>
    <text x="18" y="84" class="card-desc">generates fresh AnyDesk ID.</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(610, 250)">
    <rect width="240" height="110" rx="8" fill="#f8fafc" stroke="#000000" stroke-width="2"/>
    <rect x="0" y="0" width="240" height="8" rx="4" fill="#facc15"/>
    <text x="18" y="42" class="card-title">1-Click Auto Backup</text>
    <text x="18" y="66" class="card-desc">Automatic pre-clean snapshots</text>
    <text x="18" y="84" class="card-desc">with instant one-click restore.</text>
  </g>

  <!-- Card 4 -->
  <g transform="translate(875, 250)">
    <rect width="240" height="110" rx="8" fill="#f8fafc" stroke="#000000" stroke-width="2"/>
    <rect x="0" y="0" width="240" height="8" rx="4" fill="#facc15"/>
    <text x="18" y="42" class="card-title">GitHub Auto-Updater</text>
    <text x="18" y="66" class="card-desc">Check and stream download</text>
    <text x="18" y="84" class="card-desc">releases directly inside the app.</text>
  </g>
</svg>
